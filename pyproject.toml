[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string
build-backend = "setuptools.build_meta"

[project]
name = "cv-screen"
version = "0.1.0"
description = "Human-in-the-loop CV screening assistant: extract, match against job criteria, rank with reasons. The tool recommends, the human decides."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# Floors are versions this was built and tested with; upper bounds stop an untested major
# release (or a compromised one) from being installed by CI or a fresh setup.
dependencies = [
    "anthropic>=1.12,<2",
    "click>=8.1,<9",
    "pydantic>=2.6,<3",
    "pypdf>=6.1,<7",  # 6.x has the decompression and parser DoS fixes
    "python-docx>=1.1,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.6,<1",
    "reportlab>=4.0,<6",
    "pillow>=10.0,<13",
    "packaging>=23,<27",
]

[project.scripts]
screen = "cv_screen.cli:main"

[tool.setuptools]
packages = ["cv_screen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_samples.py" = ["E501"]  # sample data table reads better unwrapped
