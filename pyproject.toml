[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-screen"
version = "0.1.0"
description = "Human-in-the-loop CV screening assistant: extract, match against job criteria, rank with reasons. The tool recommends, the human decides."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.69",
    "click>=8.1",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "reportlab>=4.0",
    "pillow>=10.0",
]

[project.scripts]
screen = "cv_screen.cli:main"

[tool.setuptools]
packages = ["cv_screen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_samples.py" = ["E501"]  # sample data table reads better unwrapped
